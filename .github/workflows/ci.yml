name: CI

#------------------------------------------------------------------------------
# Runs on every push to main/dev 
# Must pass all tests before merging to main
# 
# Tests:
#   lint-backend    -> ESLint + tsc typecheck
#   test-backend    -> Jest unit tests
#   build-backend   -> nest build
#   lint-frontend   -> ESLint + tsc typecheck
#   build-frontend  -> vite build
#
#------------------------------------------------------------------------------


on: 
  push:
    branches: [main, han_dev]
  pull_request:
    branches: [main, han_dev]

jobs:

#--------------------------LINT-BACKEND--------------------------

  lint-backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

#--------------------------BACKEND-UNIT-TESTs--------------------------

  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          DATABASE_URL: postgresql://test:test@localhost:5432/test

#--------------------------BUILD-BACKEND--------------------------

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Verify dist existence
        run: |
          ls -la dist/
          test -f dist/main.js || (echo "dist/main.js not found" && exit 1)

#--------------------------LINT-FRONTEND--------------------------

  lint-frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

#--------------------------BUILD-FRONTEND--------------------------

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check disk space
        run: |
          TOTAL_SPACE=$(du -sk dist | cut -f1)
          echo "Size: ${TOTAL_SPACE} KB"
          if [ "$TOTAL_SPACE" -gt 51200 ]; then
          echo "::warning::Build size exceeds 50MB limit\n Current size: ${TOTAL_SPACE} KB"
            exit 1
          fi
