name: CD

#--------------------------------------------------------------------------
#
# Runs on every merge into main.
#
# Builds docker images and pushes them to Github Container Registry (GHCR).
#
# Images are tagged with the commit SHA and 'latest' tag.
# 
#
# No secrets other than GITHUB_TOKEN are needed (automatically
# provided by GitHub Actions).
#
# --------------------------------------------------------------------------

on: 
  push:
    branches: [main]

env:
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  push-backend:
    name: Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract data
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanzok/ft_transcendence-backend
          tags: |
            type=sha, prefix=sha-
            type=raw, value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
