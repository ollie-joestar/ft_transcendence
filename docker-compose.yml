volumes:
  db_data:
    name: db_data
  vault_data:
    name: vault_data
  vault_tls:
    name: vault_tls
  vault_bootstrap:
    name: vault_bootstrap
  secrets_vol:
    name: secrets_vol      # tmpfs would be ideal, named volume is simpler cross-platform
  # frontend_module:
  #   name: frontend_module
  # backend_module:
  #   name: backend_module

networks:
  public_network:
    name: public_network
    driver: bridge
  app_network:
    name: app_network
    driver: bridge
  db_network:
    name: db_network
    driver: bridge
