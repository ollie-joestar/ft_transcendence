# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
# -------------------------------------------------------------------
# Loaded AFTER the CRS rules, so the SQLi rules already exist and can be
# retargeted at config-load time. No per-request ctl action, no macros —
# this avoids the v3 parser error that %{MATCHED_VAR} caused.
#
# A third-party SDK bundled in the frontend (NOT your own code — that's why
# `grep mixpanel frontend/src` finds nothing) initialises Mixpanel and sets a
# cookie named:
#     mp_<project-token>_mixpanel
# Its JSON value uses $-prefixed keys ($device_id, $initial_referrer, ...),
# which rule 942290 reads as a NoSQL/Mongo injection and blocks (5 points).
#
# Remove that one cookie as a target from every SQLi rule (tag: attack-sqli).
# SQLi inspection stays fully active on query strings, bodies, and all other
# inputs; only this analytics cookie is exempted.

SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_COOKIES:mp_2647310162474a4f7ca66a277c543032_mixpanel"

# If the Mixpanel project token ever changes (different cookie name), use this
# regex variant instead of the exact name above:
# SecRuleUpdateTargetByTag "attack-sqli" "!REQUEST_COOKIES:/^mp_.+_mixpanel$/"
