# Internal-only vhost. Receives traffic from the OWASP nginx edge container.
# No TLS here — TLS terminates at the edge.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Health check endpoint (used by Docker + edge nginx upstream checks)
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Immutable hashed assets (Vite outputs filenames like main.abc123.js)
    location ~* \.(js|css|woff2|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files (images, icons, etc.) — shorter cache
    location ~* \.(png|jpg|jpeg|svg|ico|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback — any route not matching a real file goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
