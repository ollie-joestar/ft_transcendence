	# ------------------------------------------------------------------------------
	# TEAM NOTE - OWASP CRS TEMPLATE MODE
	# ------------------------------------------------------------------------------
	# This file is NOT a full nginx.conf. It is a single server{} template mounted at:
	#   /etc/nginx/templates/conf.d/default.conf.template
	# and rendered by owasp/modsecurity-crs:nginx-alpine at container startup.
	#
	# Allowed here:
	# - app routing/proxy directives
	# - HTTP -> HTTPS redirect behaviour
	# - optional server_name for host matching
	#
	# Pls do NOT do this in this file:
	# - add nested/duplicate server{} blocks with overlapping behaviour
	# - force "listen 443 ssl" (container runs unprivileged; low ports are restricted)
	# - hardcode project-specific cert paths/ports
	#
	# Why:
	# TLS cert files are generated/managed by the image startup flow. Use env vars
	# (PORT / SSL_PORT / SSL_CERT / SSL_KEY / BACKEND) so startup templating controls
	# final values instead of hardcoding them here.
	# ------------------------------------------------------------------------------


	server {
		server_name sakuradrift.example.com;
		listen ${PORT};
		listen ${SSL_PORT} ssl;
		ssl_certificate ${SSL_CERT};
		ssl_certificate_key ${SSL_KEY};
		ssl_protocols TLSv1.2 TLSv1.3;

		if ($scheme = http) {
			return 301 https://$host:${SSL_PORT}$request_uri;
		}

		# Intercepts Nginx's internal 497 error and automatically redirects
		# to the HTTPS version of the URL on the same port.
		error_page 497 https://$host:${SSL_PORT}$request_uri;

		location /health {
			return 200 'OK';
			add_header Content-Type text/plain;
		}

		location /api/ {
			proxy_pass          ${BACKEND}/;
			proxy_http_version  1.1;
			proxy_set_header    Host                $host;
			proxy_set_header    X-Real-IP           $remote_addr;
			proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
		}

		location /ws {
			proxy_pass          ${BACKEND};
			proxy_http_version  1.1;
			proxy_set_header    Host                $host;
			proxy_set_header    X-Real-IP           $remote_addr;
			proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
			proxy_set_header    Upgrade             $http_upgrade;
			proxy_set_header    Connection          'upgrade';
		}

		location / {
			proxy_pass          http://frontend:80;
			proxy_http_version  1.1;
			proxy_set_header    Host                $host;
			proxy_set_header    X-Real-IP           $remote_addr;
			proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
			proxy_set_header    Upgrade             $http_upgrade;
			proxy_set_header    Connection          'upgrade';
		}
	}
